# Render Blueprint — AcadIn. Backend
# Deploy: Import this file in Render dashboard → "New Blueprint Instance"
# Docs:  https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aip-api
    env: node
    region: oregon # change to frankfurt / singapore / ohio if preferred
    plan: free # upgrade to starter or flex for production

    # Build
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Build succeeds before deploy starts; pnpm build at repo root produces:
    #   packages/*/dist/   ← shared packages first (handled by monorepo order)
    #   apps/api/dist/     ← TypeScript compiled output (tsc -p apps/api/tsconfig.json)

    startCommand: node apps/api/dist/server.js

    # Health check — Render pings this to detect crashes
    healthCheckPath: /api/v1/health

    # Env vars — fill in real values below.  Mark sensitive ones as "sync: false"
    # to keep them out of the Blueprint YAML (they'll be prompted on first deploy
    # and stored in Render's secret store).
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        # Production frontend (static site). Also the only Origin the CORS policy
        # and the CSRF Origin guard accept — it must match the site exactly.
        # The live API for this frontend is https://academia7.onrender.com.
        value: https://aip-qq08.onrender.com
      - key: MONGODB_URI
        sync: false # prompted on first deploy; stored encrypted
      - key: MONGODB_DB_NAME
        value: acadin_demo
      - key: JWT_ACCESS_SECRET
        sync: false # prompted on first deploy
      - key: JWT_REFRESH_SECRET
        sync: false # prompted on first deploy
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Cookies are CROSS-SITE here. onrender.com is on the Public Suffix List,
      # so aip-qq08.onrender.com and academia7.onrender.com are different sites
      # and a Lax/Strict cookie is never sent on the SPA's API requests.
      # `none` + Secure is required (and is what production serves today).
      # SameSite=None gives no CSRF protection: that is provided by the Origin
      # checks (csrfOriginGuard / requireTrustedOrigin) against FRONTEND_URL.
      # COOKIE_DOMAIN stays blank → host-only cookies on the API host.
      - key: COOKIE_DOMAIN
        value: ''
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: none
      # Google OAuth Web Client ID (the ID only — no client secret is used).
      # Must be the same ID the static site is built with as VITE_GOOGLE_CLIENT_ID;
      # ID tokens are verified against it as their audience.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_FILE_SIZE_MB
        value: '5'
      - key: RATE_LIMIT_WINDOW_MS
        value: '900000'
      # Anonymous traffic: per client IP. Signed-in traffic: per user id, so a
      # campus behind one NAT address does not share a budget. /health exempt.
      - key: RATE_LIMIT_MAX_REQUESTS
        value: '300'
      - key: RATE_LIMIT_USER_MAX_REQUESTS
        value: '600'
      # Per-user cap on the Gemini-backed /ai routes.
      - key: RATE_LIMIT_AI_MAX_REQUESTS
        value: '20'
      - key: LOG_LEVEL
        value: info
